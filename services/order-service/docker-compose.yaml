services:
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data

volumes:
  order_db_data:
