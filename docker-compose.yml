# Local infrastructure: one PostgreSQL per service (database-per-service). Usage: cp .env.example .env && docker compose up -d
services:
  order-db:
    image: postgres:${DB_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      POSTGRES_DB: order_db
    ports: ["5433:5432"]
    volumes: [order_db_data:/var/lib/postgresql/data]

  customer-db:
    image: postgres:${DB_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?set in .env}
      POSTGRES_DB: customer_db
    ports: ["5434:5432"]
    volumes: [customer_db_data:/var/lib/postgresql/data]

  payment-db:
    image: postgres:${DB_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      POSTGRES_DB: payment_db
    ports: ["5435:5432"]
    volumes: [payment_db_data:/var/lib/postgresql/data]

  inventory-db:
    image: postgres:${DB_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory_service
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      POSTGRES_DB: inventory_db
    ports: ["5436:5432"]
    volumes: [inventory_db_data:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-3.9.1}
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  order_db_data:
  customer_db_data:
  payment_db_data:
  inventory_db_data:
